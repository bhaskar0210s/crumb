name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Unit tests
        run: make test
      - name: Build
        run: |
          make REPOSITORY="$GITHUB_REPOSITORY"
      - name: Package
        run: |
          ditto -c -k --keepParent build/Crumb.app Crumb.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Crumb
          path: |
            Crumb.zip

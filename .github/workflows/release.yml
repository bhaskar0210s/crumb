name: release

# Pushing a tag such as v1.0.1 builds Crumb and publishes it as a free download. Installed copies with
# automatic updates turned on pick it up within a day.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Unit tests
        run: make test
      - name: Build
        run: |
          make VERSION="${GITHUB_REF_NAME#v}" REPOSITORY="$GITHUB_REPOSITORY"
      - name: Package
        run: |
          ditto -c -k --keepParent build/Crumb.app Crumb.zip
      # Installed copies only accept updates signed with the release key (its public half is in Info.plist).
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out Crumb.zip.sig Crumb.zip
          rm "$RUNNER_TEMP/key.pem"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Crumb.zip Crumb.zip.sig \
            --title "Crumb ${GITHUB_REF_NAME#v}" \
            --notes "Free and open source. For Macs with Apple silicon running macOS 27 or later: download Crumb.zip, unzip it and move Crumb.app to Applications. See the README for first-launch steps."

name: release

# Pushing a tag such as v1.0.1 builds Crumb and publishes it as a free download. Installed copies with
# automatic updates turned on pick it up within a day.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The newest Xcode on the runner: apps built with an older SDK get the previous macOS look.
      - name: Use the newest Xcode
        run: |
          xcode=$(python3 -c "import glob, re; apps = [a for a in glob.glob('/Applications/Xcode_*.app') if 'beta' not in a.lower() and 'release_candidate' not in a.lower()]; print(max(apps, key=lambda a: [int(n) for n in re.findall(r'\\d+', a.split('Xcode_')[1])]))")
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Unit tests
        run: make test
      - name: Build (Apple silicon and Intel)
        run: |
          make VERSION="${GITHUB_REF_NAME#v}" REPOSITORY="$GITHUB_REPOSITORY"
          make VERSION="${GITHUB_REF_NAME#v}" REPOSITORY="$GITHUB_REPOSITORY" ARCH=x86_64 BUILD=build/intel
      - name: Package
        run: |
          ditto -c -k --keepParent build/Crumb.app Crumb.zip
          ditto -c -k --keepParent build/intel/Crumb.app Crumb-Intel.zip
      # Installed copies only accept updates signed with the release key (its public half is in Info.plist).
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          for zip in Crumb.zip Crumb-Intel.zip; do
            openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$zip.sig" "$zip"
          done
          rm "$RUNNER_TEMP/key.pem"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Crumb.zip Crumb-Intel.zip Crumb.zip.sig Crumb-Intel.zip.sig \
            --title "Crumb ${GITHUB_REF_NAME#v}" \
            --notes "Free and open source. Download Crumb.zip for Apple silicon Macs or Crumb-Intel.zip for Intel Macs, unzip it and move Crumb.app to Applications. See the README for first-launch steps."
